[project]
name = "xhs-monitor"
version = "0.1.0"
description = "小红书商品销量监控（系统 2）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright>=1.48",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_monitor", "src/xhs_collector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
